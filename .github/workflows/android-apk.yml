name: Android 예제 앱 APK

on:
  push:
    branches: [main, android-sdk]
    paths: ["android/**", "models/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :sample:assembleDebug
      - name: Screenshot screens (design check)
        working-directory: android
        run: ./gradlew --no-daemon :sample:recordRoborazziDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: android/sample/build/outputs/roborazzi/
      - name: Rename APK
        run: cp android/sample/build/outputs/apk/debug/sample-debug.apk plate-engine-sample.apk
      - uses: actions/upload-artifact@v4
        with:
          name: plate-engine-sample-apk
          path: plate-engine-sample.apk
      - name: Publish as pre-release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sample-apk-${{ github.run_number }}"
          cd android/sample/build/outputs/roborazzi && zip -q ../../../../../screenshots.zip *.png && cd -
          gh release create "$TAG" plate-engine-sample.apk screenshots.zip \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "예제 앱 APK #${{ github.run_number }} (${GITHUB_REF_NAME})" \
            --notes "갤러리 사진으로 번호판·차종·색상을 기기 안에서 인식하는 예제 앱 (디버그 빌드). 커밋 ${{ github.sha }}"
