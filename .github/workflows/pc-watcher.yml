name: PC 번호판 자동정리 (Windows)

on:
  push:
    branches: [main, claude/project-thread-h4dwnf]
    paths: ["pc/**", "engine/**", "models/**", ".github/workflows/pc-watcher.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pillow onnxruntime mediapipe pyinstaller
      - name: Build exe
        run: |
          pyinstaller --noconfirm --windowed --name PlateWatcher \
            --collect-all mediapipe \
            --add-data "models;models" \
            --hidden-import engine.engine \
            --paths . \
            pc/plate_watcher.py
          cp pc/사용법.txt dist/
      - name: Smoke test (synthetic plate photo)
        run: |
          mkdir -p smoke/watch/sub
          python - <<'EOF'
          import cv2, numpy as np, random, json
          random.seed(1); np.random.seed(1)
          from train.synth_plates import render_plate
          rgb, lab, col, two = render_plate()
          while two:
              rgb, lab, col, two = render_plate()
          canvas = np.full((600, 800, 3), 120, np.uint8)
          p = cv2.resize(cv2.cvtColor(rgb, cv2.COLOR_RGB2BGR), (300, 66))
          canvas[260:326, 250:550] = p
          cv2.imencode(".jpg", canvas)[1].tofile("smoke/watch/sub/photo.jpg")
          json.dump({"label": lab}, open("smoke/truth.json", "w", encoding="utf-8"), ensure_ascii=False)
          EOF
          ./dist/PlateWatcher/PlateWatcher.exe --selftest smoke/watch smoke/result.json &
          wait $!
          cat smoke/result.json
          python - <<'EOF'
          import json, os
          r = json.load(open("smoke/result.json", encoding="utf-8"))
          t = json.load(open("smoke/truth.json", encoding="utf-8"))
          assert r["ok"], r
          rec = r["results"][0]
          print("정답", t["label"], "인식", rec["번호"], "→", rec["이동위치"])
          assert os.path.isfile(rec["이동위치"]), "백업 폴더로 옮겨지지 않음"
          assert os.path.join("smoke", "watch_백업", "sub") in rec["이동위치"], "하위 폴더 구조가 유지되지 않음"
          assert rec["결과"] == "인식" and rec["번호"] == t["label"], "번호판 인식 실패"
          EOF
      - name: Screenshot window
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/PlateWatcher/PlateWatcher.exe -PassThru
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png")
          Stop-Process -Id $p.Id -Force
      - name: Zip
        run: |
          python - <<'EOF'
          import os, zipfile
          with zipfile.ZipFile("PlateWatcher-win64.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for d, _, fs in os.walk("dist"):
                  for f in fs:
                      p = os.path.join(d, f)
                      z.write(p, os.path.join("번호판자동정리", os.path.relpath(p, "dist")))
          print(os.path.getsize("PlateWatcher-win64.zip") // 1024 // 1024, "MB")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-watcher
          path: |
            PlateWatcher-win64.zip
            screenshot.png
            smoke/result.json
      - name: Publish as pre-release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pc-watcher-${{ github.run_number }}"
          gh release create "$TAG" PlateWatcher-win64.zip screenshot.png smoke/result.json \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "PC 번호판 자동정리 #${{ github.run_number }} (${GITHUB_REF_NAME})" \
            --notes "Windows용. 압축을 풀고 번호판자동정리\\PlateWatcher\\PlateWatcher.exe 실행. 사용법은 사용법.txt. 커밋 ${{ github.sha }}"
